> **분석 전 유의사항**: 이 논문은 설문조사·실험·2차자료 분석 등을 수행하는 실증연구가 아니라, B2B 마케팅 연구영역 전체를 대상으로 한 **메타이론적(meta-theoretical) 개념 논문**입니다. 따라서 본 템플릿의 STEP 4(연구모델·변수)와 STEP 5(Method 재현)는 통상적인 "독립/종속변수·설문측정·통계분석" 틀이 아니라 이 논문이 실제로 사용한 **"패러다임 프로파일링(paradigmatic profiling)"** 이라는 메타이론적 분석기법에 맞추어 재구성하였습니다. 이 조정 사항은 각 STEP 서두에 별도로 명시했습니다.

## STEP 1 — 논문 제목 및 Abstract 번역

### 제목

| 원문(English) | 한국어 번역 |
|---|---|
| Clearing the paradigmatic fog — how to move forward in business marketing research | 패러다임의 안개 걷어내기 — 비즈니스 마케팅 연구는 어떻게 나아가야 하는가 |

*번역 주석*: "paradigmatic fog"는 문자 그대로 "패러다임의 안개"로 직역했습니다. 저자들이 감사의 글에서 밝히듯 이 은유는 Tore Strandvik 교수가 제안한 표현으로, "연구자들이 자신이 속한 패러다임(연구 전통)의 암묵적 가정에 갇혀 학문 발전의 방향을 제대로 보지 못하는 상태"를 비유합니다. 따라서 "안개를 걷어낸다"는 표현을 그대로 살려 원저자의 은유적 의도를 보존했습니다.

## STEP 2 — 핵심 주장 (1분 설명용)

**연구 질문(Research Question)**
B2B(기업간) 마케팅 연구를 지배해온 두 연구전통 — 북미 주류(NAM)와 IMP 그룹 — 은 각각 어떤 근본적 가정(세계관·인식론·방법론)에 기반해 지식을 생산하며, 이 두 전통이 만들어낸 "지배적 연구문화"는 결과적으로 어떤 연구주제를 다루게 하고 어떤 주제를 놓치게 만드는가? 그리고 이 학문분야는 어떻게 그 문화적 장벽을 넘어 발전할 수 있는가?

**핵심 발견(Key Findings)**
1. NAM 전통은 자연과학적 이상(natural science ideal)과 관리적 지향(managerial orientation)을 핵심 가치로 삼아, 정량적·변수기반(variable-based) 방법론으로 "비교적 단순하고 반복적으로 발생하는" 현상을 설명하는 데는 탁월하지만, 복잡한 전략적 이슈(생태계, 파괴적 비즈니스모델 등)를 다룰 도구와 정당성을 갖추지 못했다.
2. IMP 전통은 사회구성주의(social constructionism)와 복잡성에 대한 몰입을 핵심 가치로 삼아, 사례연구를 통한 질적·기술적(descriptive) 이해에는 강하지만, 각 사례의 "고유성(uniqueness)"을 지나치게 강조한 나머지 체계적 이론화·비교연구·경영자에게 실질적 조언을 제공하는 데 취약하다.
3. 두 전통은 "복잡성 연속체(complexity continuum)" 상에서 각각 낮은 복잡성(NAM)과 높은 복잡성(IMP) 영역만을 다루고, 중간~중상 복잡성 영역(새로운 시장형태, 생태계 진화, 전략적 네트워크 등)은 두 전통 모두에게 방치된 "연구 공백(research gap)"으로 남아있다.
4. 이 공백은 무작위가 아니라 각 공동체의 뿌리깊은 문화적 신념(정당성 장벽/legitimacy barrier for NAM, 이념적 장벽/ideological barrier for IMP)에서 구조적으로 발생한다.

**이론적 기여(Theoretical Contribution)**
B2B 마케팅 지식생산의 구조를 Kuhn/Morgan의 패러다임 개념과 4대 메타이론적 차원(가치론·존재론·인식론·방법론)으로 체계화하여 두 전통을 최초로 나란히 프로파일링(Table 1)하고, 그 문화적 뿌리와 결과(연구 공백, Table 2)를 인과적으로 연결한 분석틀을 제시함.

**실무적 기여(Practical Contribution)**
개별 연구자·박사과정생이 자신의 연구가 어떤 패러다임적 가정에 갇혀 있는지 스스로 성찰하게 하며, NAM 연구자에게는 QCA(질적비교분석)와 형태론적(configurational) 접근을, IMP 연구자에게는 비교사례·이론주도적 연구설계(전략적 네트워크 관점)를 구체적 돌파구로 제안함.

**한 줄 요약**: 이 논문은 B2B 마케팅의 두 지배적 연구전통(NAM, IMP)이 상반된 패러다임적 신념 때문에 서로 다른 "보이지 않는 감옥"에 갇혀 중간 복잡성의 전략적 연구주제를 공백으로 남겼음을 메타이론적으로 규명하고, 각 전통이 그 문화적 장벽을 넘어설 구체적 방향을 제안하는 개념 논문이다.

## STEP 4 — 연구 모델 및 구성 변수 상세 분석

> **적용상 유의**: 본 논문은 설문/실험 데이터를 사용하지 않으므로 "독립/종속/매개/조절 변수"라는 통상적 통계모델 언어가 그대로 적용되지 않습니다. 대신 논문의 실제 분석틀인 **"패러다임 프로파일링 모델"**을 이 STEP의 형식에 맞춰 재구성했습니다. 두 연구전통(NAM, IMP)을 비교 대상(범주형 "그룹변수"에 해당)으로, 4대 메타이론적 차원(가치론·존재론·인식론·방법론)을 "profiling 변수"로, 그리고 그 결과로 나타나는 "연구 공백(research gap)"과 "장벽(barrier)"을 결과(종속) 개념으로 다룹니다.

### (A) 비교 대상 "그룹" 변수 — North American Mainstream (NAM)

- **변수 이름**: North American Mainstream tradition (NAM) / 북미 주류 전통
- **개념적 정의**: 자연과학적 이상과 관리적 실무 지향을 공유하며 정량적 방법론을 정당한 지식생산 방식으로 규정하는 B2B 연구 공동체. 마케팅관리 지향(marketing management orientation)과 행동이론구축 지향(behavioral theory-building orientation)의 두 축으로 구성되며, 각각 관리적 마케팅/마케팅과학 스트림, 채널연구/관계마케팅 스트림으로 세분(Fig. 1, p.284).
- **조작적 정의**: Backhaus, Lügger & Koch(2011), LaPlaca & Katrichis(2009) 등 기존 서지분석에서 식별된 6대 연구주제(조직구매행동, 영업관리, 신제품개발, 채널/유통, 구매자-판매자 관계, 마케팅전략)로 조작화(p.283–284).
- **측정 및 출처**: 별도의 신규 설문측정은 없음. 저자들이 기존 문헌(Cortez & Johnston, 2017; Hadjikhani & LaPlaca, 2013; Möller, 2013; Pels et al., 2009)의 분류체계를 종합·재구성하는 방식으로 "측정"을 대신함.
- **관련 논의**: Kuhn(1996)의 패러다임 개념, Morgan(1980)의 패러다임 3대 의미(세계관/학자집단/도구), Dwyer, Schurr & Oh(1987)의 관계마케팅 기원, Steenkamp & Baumgartner(2000)의 SEM 확산에 관한 논의와 연결됨.

### (B) 비교 대상 "그룹" 변수 — Industrial Marketing and Purchasing group (IMP)

- **변수 이름**: Industrial Marketing and Purchasing group-driven research (IMP) / IMP 그룹 중심 연구
- **개념적 정의**: 사회구성주의와 비판적 실재론에 기반하여 기업간 관계·네트워크의 고유성과 맥락성을 사례연구로 심층 기술하는 B2B 연구 공동체. 상호작용 접근(interaction approach)과 네트워크 접근(network approach)의 두 축으로 구성(Fig. 2, p.287).
- **조작적 정의**: 1970년대 후반 유럽 5개 대학이 참여한 최초 IMP 프로젝트(Håkansson, 1982)에서 도출된 Interaction Model, 이후 ARA(Actor-Resource-Activity) 프레임워크(Håkansson & Johanson, 1992)로 조작화.
- **측정 및 출처**: 마찬가지로 신규 측정 없음. Axelsson(2010), Håkansson & Gadde(2018), Möller & Halinen(2017, 2018)의 IMP 역사·이론지도 문헌을 재구성.
- **관련 논의**: 자원의존이론(Pfeffer & Salancik, 1978), 사회교환이론(Cook & Emerson, 1978), 거래비용경제학(Williamson, 1985) 등이 IMP 상호작용 접근의 이론적 토대로 논의됨.

### (C) Profiling "변수" — 4대 메타이론적 차원 (Table 1의 열)

| 변수명(영/한) | 개념적 정의 | NAM에서의 조작화 | IMP에서의 조작화 |
|---|---|---|---|
| Axiology / 가치론(무엇을 가치있게 여기는가) | 공동체가 추구하는 연구목표·핵심가치 | 설명과 처방(explanation and prescription), 방법론적 엄밀성, 관리도구 제공 — 방법주도적(method-driven) 연구 | 이해와 기술(understanding and description), 맥락·시간적 복잡성의 의미 파악 — 현상주도적(phenomenon-driven) 연구 |
| Ontology / 존재론(세계관) | 연구대상의 실재 본질에 대한 가정 | 실재론/비판적 실재론; 객관적 실재 전제; 독립적 공급자-구매자의 "작동시장"; 경쟁이 시장을 형성; 행위자는 계량화 가능한 변수로 취급 | 사회구성주의/비판적 실재론; 다중의 국지적 실재; 시장=상호의존적 관계의 네트워크; 경쟁뿐 아니라 협력 필요; 행위자는 역사적 맥락에 배태(embedded) |
| Epistemology / 인식론(지식구성 방식) | 지식이 어떻게 생성·정당화되는가 | 객관적 측정; 전통적 인과관계("원인의 효과") 규명; 사전이론 기반 가설검증 | 주관적 지식; 지식은 사회적 협상의 산물; 구조와 과정 모두에 주목; 두꺼운 기술(thick description)을 통한 이해 |
| Methodology / 방법론(연구도구) | 정당한 것으로 간주되는 연구방법 | 정량적 방법, 수리·통계모델링, 최적화, 실험설계; 최근 QCA로 확장 중 | 정성적 방법, 사례연구, 과정연구; 서사분석·질적비교분석·민속지학 등으로 다변화 중 |

### (D) 결과("종속") 개념 — 연구 공백과 장벽

- **변수 이름**: Research gap (연구 공백) / Paradigmatic barrier (패러다임적 장벽)
- **개념적 정의**: 두 전통이 공유하는 "복잡성 연속체(complexity continuum, Fig. 3)"에서, NAM(저복잡성)과 IMP(고복잡성) 사이에 방치된 중간~중상 복잡성 수준의 미개척 연구영역, 그리고 각 공동체가 이 영역으로 이동하지 못하게 막는 문화적 장벽.
- **조작적 정의**: Table 2에 6개 하위영역으로 구체화 — (NAM측) 시장형태와 과정, 채널구조·과정·관계, 비즈니스 마케팅 관행 / (IMP측) 특정 네트워크 형태·과정의 이유, 전략적 네트워크의 존재와 유형, 전략적 네트워크의 관리.
- **측정 및 출처**: 저자들의 문헌 검토와 논증을 통한 질적 도출(정량 측정 없음).
- **관련 논의**: Midgley, Nicholson & Brennan(2017)의 방법론적 다원주의에 대한 철학적·문화적·심리적 장애 논의, Weaver(1991)의 복잡성 스펙트럼(단순성-무질서한 복잡성-조직화된 복잡성) 논의와 연결.

## STEP 5 — Method 재현 순서 분해

> **적용상 유의**: 이 논문의 "Method"는 데이터 수집·통계분석이 아니라 **문헌에 기반한 메타이론적 논증(paradigmatic profiling)** 절차입니다. 아래는 이 논문을 읽지 않은 연구자가 동일한 절차로 유사한 메타이론적 비교분석을 수행할 수 있도록 단계별로 분해한 것입니다.

**STEP 1) 분석 대상 패러다임(연구공동체) 선정**
(1) 수행 내용: B2B 마케팅 연구영역에서 기존 서지분석·이론지도 문헌을 근거로, 전체 연구의 다수를 차지하는 두 지배적 전통(NAM, IMP)을 분석대상으로 선정. 서비스지배논리(SDL) 등 신흥 관점은 아직 지배적 패러다임 지위에 이르지 못했다고 판단하여 제외.
(2) 원문 위치: p.282, §1.2 Premises.

**STEP 2) 메타이론적 비교틀(4대 차원) 확립**
(1) 수행 내용: Kuhn(1996), Morgan(1980), Arndt(1985) 등의 과학철학 문헌에서 패러다임 개념의 4대 차원(가치론·존재론·인식론·방법론)을 도출하여 비교 프레임워크로 채택.
(2) 원문 위치: p.282–283, §2.1.

**STEP 3) "패러다임 프로파일링" 분석기법 채택**
(1) 수행 내용: Möller(2013), Pels, Möller & Saren(2009)이 개발한 패러다임 프로파일링 방법을 적용 — 추상적 유형론(typology)보다 상세한 프로토타입적 특성 기술을 각 전통에 대해 작성하는 방식.
(2) 원문 위치: p.283, §2.3.

**STEP 4) NAM 연구전통 기술: 연구 스트림 분류**
(1) 수행 내용: 기존 서지·이론지도 문헌(Backhaus et al., 2011; LaPlaca & Katrichis, 2009; Cortez & Johnston, 2017 등)을 종합하여 NAM을 마케팅관리 지향(관리적 마케팅/마케팅과학 스트림)과 행동이론구축 지향(채널연구/관계마케팅 스트림)의 4개 세부 스트림으로 구조화(Fig. 1).
(2) 원문 위치: p.283–286, §3 전체.

**STEP 5) NAM의 역사적 동인(driver) 분석**
(1) 수행 내용: 1950–60년대 미국 경영대학의 제도적 압력(Ford/Carnegie 재단 보고서), 경영과학·정량방법의 부상, "마케팅=관리기능" 관념의 정착이라는 3가지 역사적 동인을 서술하여 NAM 문화의 기원을 설명.
(2) 원문 위치: p.286–287, §3.3.

**STEP 6) IMP 연구전통 기술: 연구 스트림 분류**
(1) 수행 내용: 1970년대 후반 유럽 5개 대학 공동프로젝트에서 출발한 IMP의 형성사를 서술하고, 상호작용 접근과 네트워크 접근(ARA 프레임워크 포함)의 2개 스트림으로 구조화(Fig. 2).
(2) 원문 위치: p.286–288, §4.1.

**STEP 7) IMP의 문화적 동인 분석**
(1) 수행 내용: 복잡성에 대한 몰입, 회의적 도전자(challenger) 정체성, 분석적 기술(description)에 대한 열정, 확장에의 열망이라는 4개 동인을 서술.
(2) 원문 위치: p.287–288, §4.2.

**STEP 8) 비교 프로파일 표 작성(Table 1)**
(1) 수행 내용: STEP 2의 4대 차원을 열(column)로, NAM/IMP를 행(row)으로 하여 각 셀에 프로토타입적 특성을 서술한 비교표를 구성 — 논문의 핵심 산출물.
(2) 원문 위치: p.288–289, Table 1, §5.1–5.2.

**STEP 9) 복잡성 연속체 위에서 결과(연구범위) 도출(Fig. 3)**
(1) 수행 내용: 각 전통의 문화적 특성이 실제로 "어떤 복잡성 수준의 현상을 연구대상으로 삼는가"에 미친 영향을 논증하여, NAM=저복잡성/IMP=고복잡성이라는 결과를 도출.
(2) 원문 위치: p.289–292, §5.3.

**STEP 10) 연구 공백의 구체화(Table 2)**
(1) 수행 내용: 복잡성 연속체의 중간~중상 영역에서 두 전통 모두가 다루지 않은 구체적 연구질문(시장/네트워크 형태, 채널/전략적 네트워크 구조, 비즈니스 관행)을 열거.
(2) 원문 위치: p.292–293, Table 2, §6.1.

**STEP 11) 장벽 극복방안 제안(Fig. 4)**
(1) 수행 내용: NAM에는 "정당성 장벽"을 넘기 위한 QCA/형태론적 접근을, IMP에는 "이념적 장벽"을 넘기 위한 이론주도적 비교사례연구(전략적 네트워크 관점 포함)를 각각 제안.
(2) 원문 위치: p.293–296, §6.2–6.3.

**STEP 12) 결론·시사점·한계 서술**
(1) 수행 내용: 연구함의(§7.1), 한계(§7.2 Caveats)를 서술하고 미래 연구자에게 자신의 "패러다임적 프로필"을 성찰할 것을 제안하며 마무리.
(2) 원문 위치: p.296–297, §7.

**재현 가능성 평가**: **부분 재현 가능(Partially Reproducible)** — 4대 차원 비교틀과 절차(STEP 1~11)는 명시적이어서 동일한 논리 구조는 따라갈 수 있으나, 저자들 스스로 "결론은 우리 자신의 내성(introspection)과 이 분야에서의 장기간 활동에 근거한다"(p.283)고 인정하듯 실제 판단과정이 체계적 서지분석이 아닌 저자 개인의 해석에 크게 의존하므로, 동일한 절차를 다른 연구자가 수행하더라도 동일한 Table 1/Table 2 내용에 도달한다는 보장은 없음.

## STEP 6 — Limitation 분리

### A. 논문이 스스로 인정한 한계 (§7.2 Caveats, p.297)

1. **역사적 분석의 결여**: "Within the limits of one paper, we could not carry out a proper historical analysis of the evolution of the NAM and IMP research traditions but relied primarily on the available treatises." — NAM/IMP 전통의 진화 과정에 대한 1차 사료 기반 역사연구가 아니라 기존 개관 문헌(2차자료)에 의존했음을 인정(p.297).
2. **이분법의 인위성**: "the business marketing domain does not divide into clear-cut paradigmatic camps... a part of B2B studies do not self-evidently represent pure NAM or pure IMP but operate often on a transition zone between the two paradigms." — 실제 연구실무에서는 NAM/IMP의 경계가 뚜렷하지 않으며, 많은 연구가 두 패러다임의 "전이지대"에 위치함을 인정(p.297).
3. **분석 범위의 제한**: "we have understandably left out business marketing research that is not carried out under these broad umbrellas." — NAM·IMP 어느 우산에도 속하지 않는 B2B 연구(예: 서비스지배논리 SDL, 거시마케팅 등)는 분석에서 제외했음을 인정(p.297).

### B. 논문이 언급하지 않았지만 비판적으로 의심할 점

1. **저자 포지셔널리티(연구자 편향) 문제**: 저자들 스스로 "We have both worked closer to the IMP community than the mainstream, and we are aware of the difficulties of crossing paradigms"(p.282)라고 밝혔음에도, 이 사실이 실제 분석 결과(예: IMP에 대한 서술이 상대적으로 더 공감적이거나 정교한지 여부)에 어떤 영향을 미쳤는지에 대한 성찰은 제한적이다. NAM에 대한 서술이 다소 환원주의적으로 단순화되었을 가능성을 배제할 수 없다.
2. **검증 불가능한 방법론(비체계적 문헌 선택)**: 서지분석(bibliometric analysis)이나 체계적 문헌고찰(systematic review) 프로토콜 없이, 저자들이 선택적으로 인용한 문헌(상당수가 Möller 본인의 선행 이론지도 논문)에 기반해 Table 1·2를 구성했다. 동일 저자의 자기인용(self-citation) 비중이 높아 순환논증(circularity)의 위험이 있다.
3. **서구(북미-유럽) 중심의 이분법**: NAM과 IMP라는 두 축은 본질적으로 미국과 (북)유럽 학계의 산물이며, 아시아·남미 등 비서구권 B2B 연구전통이나 최근 부상하는 신흥시장 기반 연구는 애초에 분석 프레임에서 고려되지 않았다. "두 전통이 전체를 지배한다"는 전제 자체가 특정 지역 학계의 시야에 갇혀 있을 수 있다.
4. **반증 불가능한 처방(prescriptive but untested)**: NAM에는 QCA/형태론적 접근을, IMP에는 이론주도적 비교사례연구를 "돌파구"로 제안하지만, 이 제안들이 실제로 지목된 연구 공백을 해소할 것이라는 경험적 증거는 제시되지 않는다. 제안은 논리적 정합성에 기반한 규범적 주장(normative argument)일 뿐 검증된 것이 아니다.
5. **자인된 "사고 논문(thought piece)" 성격의 반증가능성 문제**: 저자들 스스로 "our study is more like a thought piece than a conventional conceptual contribution"(p.282)이라고 밝혔다. 이는 학문적 엄밀성보다 논쟁·토론 유발을 목표로 하는 수사적(修辭的) 텍스트일 가능성을 시사하며, Table 1·2에 담긴 대조가 실제로 반증가능한 명제인지, 혹은 저자의 논지를 뒷받침하기 위해 선택적으로 구성된 예시(cherry-picking)인지 독자가 독립적으로 검증하기 어렵다.
6. **역인과/공진화 가능성 간과**: 논문은 "문화적 신념 → 연구관행 → 지식결과"라는 일방향적 인과구조를 전제하지만, 실제로는 학술지 심사관행·연구비 지원구조·박사교육 시스템 등 제도적 요인이 먼저 존재하고 이것이 "문화적 신념"을 사후적으로 정당화했을 가능성(즉 제도가 신념을 형성하는 역방향 인과)도 배제할 수 없다.
7. **"복잡성 연속체(Fig. 3)"의 조작적 정의 부재**: 복잡성(complexity)이라는 핵심 개념이 Weaver(1991)의 오래된 일반 과학철학 논의를 원용할 뿐, B2B 마케팅 맥락에서 무엇이 "낮은/중간/높은" 복잡성인지에 대한 조작적 기준이나 척도는 제시되지 않아, Table 2의 "중간 복잡성 공백" 주장 자체가 다소 자의적으로 설정되었을 위험이 있다.
