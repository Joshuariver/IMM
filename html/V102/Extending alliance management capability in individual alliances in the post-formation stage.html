## STEP 1 — 논문 제목 및 Abstract 번역

### 제목

| 원문 (English) | 한국어 번역 |
|---|---|
| Extending alliance management capability in individual alliances in the post-formation stage | 형성 이후(사후 형성) 단계의 개별 얼라이언스에서 얼라이언스 관리 역량(Alliance Management Capability) 확장하기 |

> **번역 주석**: `Individual alliances`는 얼라이언스 포트폴리오(alliance portfolio, 다수 제휴를 총괄 관리)와 대비되는 개념으로, 개별 제휴 관계 하나하나를 관리하는 역량을 지칭하므로 "개별 얼라이언스"로 직역했다. `Post-formation stage`는 얼라이언스가 계약·협상을 거쳐 결성된 이후, 실제 운영·관리되는 단계를 의미하므로 "형성 이후 단계" 또는 "사후 형성 단계"로 병기했다.

### Abstract

| 원문 (English) | 한국어 번역 |
|---|---|
| Strategic alliances are increasingly important to firms, yet many alliances do not achieve their goals. | 전략적 얼라이언스(strategic alliances)는 기업들에게 점점 더 중요해지고 있지만, 많은 얼라이언스가 목표를 달성하지 못하고 있다. |
| This lack of success can be attributed to poor mitigation of risks related to performance and to managing relationships. | 이러한 성공 실패는 성과(performance)와 관련된 위험, 그리고 관계 관리와 관련된 위험을 제대로 완화하지 못한 데에서 기인한다고 볼 수 있다. |
| Current conceptualizations of the capability to manage the post-formation stage of alliances overly focus on mitigation of relationship management risks, and as a result do not fully address both types of risks. | 얼라이언스의 형성 이후 단계를 관리하는 역량에 대한 기존의 개념화들은 관계관리 위험(relationship management risk)의 완화에 지나치게 초점을 맞추고 있어서, 결과적으로 두 가지 위험 유형을 모두 충분히 다루지 못하고 있다. |
| We draw on Social Exchange theory, the Resource Based View and Transactions Costs Economics to extend the conceptualization of alliance management capability (AMC) by adding specific justice-related activities and resource management skills to the extant conceptualizations. | 본 연구는 사회교환이론(Social Exchange Theory, SET), 자원기반관점(Resource Based View, RBV), 거래비용경제학(Transactions Costs Economics, TCE)을 토대로, 기존의 얼라이언스 관리 역량(Alliance Management Capability, AMC) 개념화에 공정성(justice) 관련 활동과 자원관리(resource management) 스킬을 추가하여 개념을 확장한다. |
| We focus our attention on the post formation stage. | 본 연구는 형성 이후 단계에 초점을 맞춘다. |
| We test our hypotheses using a sample of 154 Indian firms engaged in strategic alliances in the IT industry and we find support for our extended conceptualization of AMC and a strong positive association with alliance performance. | 우리는 IT 산업에서 전략적 얼라이언스를 맺고 있는 인도 기업 154개를 표본으로 가설을 검증하였으며, 확장된 AMC 개념화에 대한 지지와 함께 얼라이언스 성과(alliance performance)와의 강한 정(+)의 관련성을 확인하였다. |
| We also demonstrate that our extended conceptualization provides additional explanatory power in relation to alliance performance than the original AMC. | 또한 본 연구는 확장된 개념화가 기존(원래)의 AMC 개념화보다 얼라이언스 성과에 대해 더 높은 설명력을 제공함을 보여준다. |
| Implications for managers and opportunities for future research are explored. | 관리자를 위한 시사점과 향후 연구를 위한 기회도 함께 논의한다. |

**핵심 키워드(Keywords)**: Alliance management capability(얼라이언스 관리 역량), Organizational justice(조직 공정성), Risk management(위험 관리), Resource management(자원 관리)

> **용어 선택 주석**:
> - `Alliance management capability (AMC)`는 국내 경영학 문헌에서 "동맹관리역량" 또는 "제휴관리역량"으로도 번역되나, 본 보고서에서는 원어의 뉘앙스를 살리기 위해 "얼라이언스 관리 역량"으로 통일했다(제휴/동맹 모두 통용).
> - `Justice`는 조직행동론에서 "공정성"으로 표준 번역되며, `distributive justice`/`procedural justice`는 각각 "분배적 공정성"/"절차적 공정성"으로 번역했다(조직공정성 이론의 표준 용어).
> - `Relational risk` vs `performance risk`는 각각 "관계 위험"과 "성과 위험"으로 번역하여 원문의 대구 구조를 유지했다.

## STEP 2 — 핵심 주장 (1분 설명용)

**연구 질문 (Research Question)**
얼라이언스의 형성 이후(post-formation) 단계에서, 기존의 얼라이언스 관리 역량(AMC) 개념(조정·커뮤니케이션·유대의 3요소, Schreiner, Kale, & Corsten, 2009)이 관계 위험(relational risk) 완화에만 치우쳐 있어 성과 위험(performance risk)을 충분히 설명하지 못한다는 문제의식에서, 공정성(분배적/절차적 정의) 및 자원관리(자원결합/적응) 활동을 추가한 확장된 AMC 개념이 기존 개념보다 얼라이언스 성과를 더 잘 설명하는가?

**핵심 발견 (Key Findings)**
- 인도 IT서비스 기업 154개 표본을 대상으로 한 구조방정식모형(SEM) 분석 결과, 조정·커뮤니케이션·유대·분배적 공정성·절차적 공정성·자원결합·적응의 7개 1차 요인으로 구성된 2차 요인(second-order factor)으로서의 확장된 AMC가 얼라이언스 성과와 유의한 정(+)의 관계를 가짐(표준화 계수 0.489, p < .001).
- 이는 기존 Schreiner et al.(2009)의 3요소 AMC 모형(표준화 계수 0.456, p < .001)보다 더 강한 연관성이며, 모형 적합도(fit indices)도 더 우수함.
- 7개 요소가 개별적으로는 성과와 유의한 관계를 갖지만(0.315~0.378), 하나의 역량(2차 요인)으로 결합되었을 때 설명력이 더 커짐 — 즉 "역량으로서의 결합 효과(capability synergy)"가 존재.
- 파트너십 지속 기간(length of partnership)은 AMC 수준에 유의한 정(+)의 영향을 주지만(0.207, p<.05), 기업 규모(firm size)는 AMC나 성과 어디에도 유의한 영향이 없음.

**이론적 기여 (Theoretical Contribution)**
사회교환이론(SET), 자원기반관점(RBV), 거래비용경제학(TCE)을 결합하여, 관계관리 중심으로 편중되어 있던 AMC 개념을 공정성과 자원관리 차원까지 포괄하도록 확장·통합함으로써 얼라이언스 역량 문헌의 이론적 공백(Forkmann, Henneberg, & Mitrega, 2018이 지적한 "관계 중심 편향")을 메움.

**실무적 기여 (Practical Contribution)**
얼라이언스 관리자는 관계관리 스킬(커뮤니케이션, 유대)만으로는 부족하며, 공정한 절차와 보상 배분 체계, 그리고 자원을 결합·적응시키는 능력을 함께 갖추어야 얼라이언스 성과를 극대화할 수 있다는 실무 지침을 제공함. 또한 기업 규모보다 얼라이언스 경험(파트너십 지속 기간)이 AMC 향상에 중요하다는 점에서, 중소기업도 충분히 AMC를 개발할 수 있음을 시사함.

**한 줄 요약**: 얼라이언스 성과를 높이려면 관계관리 스킬뿐 아니라 공정성 활동과 자원관리 스킬까지 결합한 확장된 얼라이언스 관리 역량이 필요하며, 이는 실증적으로 기존 개념보다 더 강한 설명력을 갖는다.

## STEP 4 — 연구 모델 및 구성 변수 상세 분석

### 개념 모형 개요
2차 요인(second-order factor)인 **확장된 얼라이언스 관리 역량(AMC)**이 7개의 1차 요인(조정·커뮤니케이션·유대·분배적 공정성·절차적 공정성·자원결합·적응)으로 구성되고, 이 AMC가 **얼라이언스 성과**에 정(+)의 영향을 미치는 구조방정식모형(SEM). 통제변수로 **파트너십 지속 기간**과 **기업 규모**를 포함(후자는 비유의하여 최종모형에서 제외).

---

### 1. Coordination (조정)
- **변수 정의**
  - 개념적 정의: "the deliberate and orderly alignment or adjustment of partners' actions to achieve jointly determined goals" (Gulati, Wohlgezogen, & Zhelyazkov, 2012, p.537). 파트너 간 상호의존적 과업을 명확한 역할 분담과 책임 배분을 통해 관리하는 스킬.
  - 조작적 정의: 파트너 관련 활동(마케팅, 프로젝트 조정 등)에 대한 사내 프로세스 구축, 회사 경계를 넘나드는 협업 프로세스, 정기적 협업 절차 조정, 인센티브 시스템의 파트너십 목표 정렬, 활동 전반의 조정 정도.
- **측정 및 출처**: 5개 문항, Schreiner et al.(2009)에서 4개 항목을 가져오고 Mohr & Spekman(1994)에서 1개 항목 추가. 7점 리커트 척도로 추정. 신뢰도 CR=0.825, AVE=0.489(기준선인 0.50에 근접, 다소 낮음). 요인적재량 0.561~0.810.
- **관련 논의**: Gulati & Singh(1998)의 조정비용(coordination cost) 논의, 계약 기반 공식적 조정 메커니즘(Contractor & Reuer, 2014)에서 관계 발전에 따른 비공식적 조정으로의 전환 논의와 연결.

### 2. Communication (커뮤니케이션)
- **변수 정의**
  - 개념적 정의: 얼라이언스 파트너 간 시의적절하고 완전한 정보를 공유하여 일상적 의사결정과 공동 과업 수행을 돕는 스킬(Schreiner et al., 2009; Schilke & Lumineau, 2018).
  - 조작적 정의: 파트너에게 제품/서비스 제안을 이해시키려는 노력, 조직변경 시 새 담당자 정보 공유, 관계에 대한 정보 제공, 파트너십 성과에 대한 기대치 소통.
- **측정 및 출처**: 4개 문항. Schreiner et al.(2009) 기반 + Styles, Patterson, & Ahmed(2008)에서 2개 항목 추가(파트너에게 관계 관련 정보를 계속 제공하는 것과 관련). CR=0.818, AVE=0.530. 요인적재량 0.676~0.797.
- **관련 논의**: 공식적(정기 회의) vs 비공식적(팀 이벤트) 커뮤니케이션 채널 구분(Muthusamy & White, 2005); 신뢰·학습 형성의 토대로 논의됨.

### 3. Bonding (유대/결속)
- **변수 정의**
  - 개념적 정의: 얼라이언스 경계 관리자(boundary spanner) 간의 강한 심리적 유대. 파트너의 니즈에 반응하고 그 관점을 존중·인정함으로써 형성됨(Schreiner et al., 2009).
  - 조작적 정의: 어려운 상황에서도 파트너 편에 서기, 문제 설명 시 경청, 단기적 이익이 없어도 파트너의 우려에 관심 갖기, 파트너의 의도를 자동적으로 이해하기, 이견 발생 시 파트너 관점 이해하려 노력하기.
- **측정 및 출처**: 5개 문항, Schreiner et al.(2009). CR=0.855, AVE=0.543. 요인적재량 0.598~0.812.
- **관련 논의**: 기회주의 방지 및 갈등해결 메커니즘 강화(Li, Jiang, Pei, & Jiang, 2017); 지식 보호와 지식 공유 사이의 딜레마(Muthusamy & White, 2005)와 연계.

### 4. Distributive Justice (분배적 공정성, DJ)
- **변수 정의**
  - 개념적 정의: 얼라이언스에서 발생하는 보상(rewards)/성과가 파트너 간에 공정하게 분배되는 정도(Luo, 2007, 2008; Melkonian, Monin, & Noorderhaven, 2011).
  - 조작적 정의: 파트너십에서 발생한 보상/수익의 공정한 분배 보장 여부, 그리고 이를 각 파트너의 헌신(commitment)·책임(responsibilities)·노력(efforts) 대비로 평가.
- **측정 및 출처**: 4개 문항, Luo(2007)에서 맥락에 맞게 수정. CR=0.828, AVE=0.618. 요인적재량 0.706~0.841.
- **관련 논의**: 사회교환이론(SET)에서 도출된 조직공정성 이론; Trada & Goyal(2017)의 불공정성-기회주의 관계, Yang, Sivadas, Kang, & Oh(2012)의 관계해체(dissolution) 방지 효과와 연결.

### 5. Procedural Justice (절차적 공정성, PJ)
- **변수 정의**
  - 개념적 정의: 보상의 결과(outcome)가 아니라 의사결정 절차 자체의 공정성에 초점(Luo, 2008; Melkonian et al., 2011). 기회주의와 부정적 행동의 위험을 낮추는 절차 개발·유지 역량(Huo, Wang, & Tian, 2016).
  - 조작적 정의: 파트너십 관련 의사결정, 계약 협상·작성, 파트너십 구조화, 활동 계획·관리, 지식 거버넌스, 계약 이행 등 6개 영역에서의 절차적 공정성.
- **측정 및 출처**: 6개 문항, Luo(2007). CR=0.937, AVE=0.712(가장 높은 신뢰도). 요인적재량 0.807~0.880.
- **관련 논의**: 절차 공정성은 시간이 지나며 개발되거나 이미 역량을 갖춘 파트너로부터 학습을 통해 구축될 수 있다는 논의(예: 공급망관리 시스템 접근권 공유를 통한 공정성 시연).

### 6. Resource Combination (자원 결합)
- **변수 정의**
  - 개념적 정의: 자체 자원과 파트너/얼라이언스가 보유한 자원을 효과적·효율적으로 결합하는 조직 수준 스킬(Wiklund & Shepherd, 2009). Sirmon, Hitt, & Ireland(2007)의 자원관리 3단계(structuring–bundling–leveraging) 중 bundling·leveraging 단계에 해당.
  - 조작적 정의: 업계 관행 대비 자사의 자원 활용 강조 정도 — 향후 사용을 위한 고유 자원 축적, 신규시장 진출 등 전략 이니셔티브를 위한 새로운 자원 활용, 신규 운영을 위한 새 자원 개발, 급진적으로 새로운 제품 창출을 위한 신규자원 활용.
- **측정 및 출처**: 4개 문항, Wiklund & Shepherd(2009). CR=0.824, AVE=0.541. 요인적재량 0.674~0.814.
- **관련 논의**: 자원기반관점(RBV)에서 "무엇을 갖고 있는가"보다 "자원으로 무엇을 하는가"가 경쟁우위를 결정한다는 논의(Sirmon et al., 2011); Chiambaretto & Wassmer(2019)의 자원 활용도(resource utilization) 연구와 연결.

### 7. Adaptation (적응)
- **변수 정의**
  - 개념적 정의: 외부 환경 변화에 따라 자원 활용 방식을 변경하는 스킬(내부 조정은 Coordination이 담당, Adaptation은 외부지향적 적응에 초점). 동적 조건에 맞춰 활동과 절차를 재구성하는 능력(Gibson & Birkinshaw, 2004).
  - 조작적 정의: 낡은 전통/관행에 도전하도록 장려, 환경 변화에 신속히 대응할 수 있는 유연성, 사업 우선순위 변화에 신속히 진화.
- **측정 및 출처**: 3개 문항, Gibson & Birkinshaw(2004) + Nadkarni & Herrmann(2010)에서 조정(adjustment) 관련 1개 항목 추가. CR=0.828, AVE=0.618. 요인적재량 0.706~0.841.
- **관련 논의**: 동적역량(dynamic capabilities) 관점(Nadkarni & Herrmann, 2010); 환경변화에 따른 전략 재구성 필요성(Schilke, 2014b)과 연계.

### 8. Alliance Management Capability (AMC, 확장된 얼라이언스 관리 역량) — 2차 요인(Second-order factor)
- **변수 정의**
  - 개념적 정의: 위 7개 1차 요인(스킬/활동)을 하나로 통합하는 기업 수준의 역량. 개별 스킬의 단순 합이 아니라 "결합될 때(combined)" 시너지 효과를 내는 2차 잠재변수로 개념화(Schilke, 2014a의 2차 동적역량 접근 차용).
  - 조작적 정의: 7개 1차 요인 각각의 표준화 요인적재량을 통해 AMC로 수렴되는 정도로 측정(CFA 2차 모형).
- **측정 및 출처**: 별도 문항 없음(2차 CFA로 도출). 검증: 단일요인모형(χ2/df=3.79, CFI=0.576) 및 상관 고정모형(χ2/df=2.403, CFI=0.788) 대비 2차모형(χ2/df=1.665, CFI=0.901)이 우월함을 확인.
- **관련 논의**: Kohtamäki, Rabetino, & Möller(2018), Wang & Rajagopalan(2015)의 얼라이언스 역량 통합모형 논의; Schilke(2014a)의 2차 동적역량 방법론적 정당화.

### 9. Alliance Performance (얼라이언스 성과) — 종속변수
- **변수 정의**
  - 개념적 정의: 다면적(multifaceted) 개념으로, 재무적/운영적/주관적 성과로 구분됨(Lunnan & Haugland, 2008). 본 연구는 주관적(perceptual) 성과 측정 방식 채택.
  - 조작적 정의: 파트너십 설립 목적 달성 여부, 자사·파트너사의 재무적 만족도, 자사·파트너사의 전반적 성과 만족도, 파트너십으로 인한 경쟁적 지위 향상 정도.
- **측정 및 출처**: 6개 문항. Krishnan, Martin, & Noorderhaven(2006) 척도를 기반으로 하고, 경쟁적 지위 관련 1개 항목을 Kale & Singh(2007)에서 추가. 사전 검토(pre-test)와 파일럿 테스트를 통해 문항의 모호성 제거. CR=0.926, AVE=0.677(가장 높은 신뢰도 중 하나). 요인적재량 0.698~0.894.
- **관련 논의**: 재무적 측정(objective)의 접근성 한계 논의(Lunnan & Haugland, 2008); 주관적·객관적 성과 간 높은 상관관계 근거(Richard, Devinney, Yip, & Johnson, 2009); 핵심정보제공자를 통한 주관적 성과 측정이 최근 연구 주류임을 강조(Jiang, Jiang, Cai, & Liu, 2015; Schilke & Lumineau, 2018).

### 10. 통제변수: 파트너십 지속 기간(Length of Partnership)
- **변수 정의**: 개념적으로 파트너십이 지속된 기간이 길수록 파트너 간 상호이해가 깊어지고 역량 수준이 높아진다는 논리(Rothaermel & Deeds, 2006; Cao & Lumineau, 2015 준용). 조작적으로는 응답자가 보고한 파트너십 지속 연수(년 단위, 표본 평균 5.4년).
- **측정 및 출처**: 단일 문항(연수), Cao & Lumineau(2015)를 따름.
- **관련 논의**: AMC에는 유의한 정(+)의 영향(0.207, p<.05)이나 성과에는 직접적 유의 효과 없음(0.0179, p=.358) — 파트너십 기간의 영향은 AMC를 매개로만 발생함을 시사.

### 11. 통제변수: 기업 규모(Firm Size)
- **변수 정의**: 종업원 수 기준. Choi & Contractor(2019), Fang, Lee, Palmatier, & Guo(2016), Rothaermel & Deeds(2006), Schilke(2014a, 2014b) 등 선행연구를 따라 통제.
- **측정 및 출처**: 단일 문항(종업원 수).
- **관련 논의**: 최종적으로 모든 변수에 유의한 영향이 없어 최종 분석에서 제외됨 — AMC 수준은 기업 규모와 무관하다는 시사점(중소기업도 AMC 개발 가능).

## STEP 5 — Method 재현 순서 분해

| 단계 | 수행 내용 | 원문 위치 |
|---|---|---|
| STEP 1 | 표본 모집단 정의: 인도 IT서비스 산업에서 전략적 얼라이언스를 맺고 있는 기업. 세 가지 소스(① Capitaline 데이터베이스, ② NASSCOM 연차보고서, ③ 대형 기술벤더 웹사이트)를 통해 총 994개 얼라이언스 식별 | p.16, §3.1 |
| STEP 2 | 전화 확인: 각 얼라이언스의 존재 여부 확인 및 담당자 연락처 확보. LinkedIn으로 세부정보 검증. 얼라이언스가 더 이상 존재하지 않거나 참여를 거부한 117개 기업(17.8%) 제외 | p.16, §3.1 |
| STEP 3 | 설문 발송: 817개 기업에 우편 설문 발송 | p.16, §3.1 |
| STEP 4 | 응답 회수: 187개 응답 수령, 이 중 43개 불완전 응답 제외 → 최종 응답률 18.8% (본문상 최종 표본은 154개 기업으로 보고됨; 187−43=144와의 수치 불일치는 STEP 6-B 참고) | p.16, §3.1 |
| STEP 5 | 핵심정보제공자(key informant) 타당성 확인: Kumar, Stern, & Anderson(1993) 방법에 따라 3개 검증 문항(① 응답자의 재직기간, ② 얼라이언스에 대한 지식, ③ 관여 기간) 포함. 표본의 평균 파트너십 기간 5.4년, 평균 보유 제휴 수 8.6개 | p.16, §3.1 |
| STEP 6 | 무응답 편의(non-response bias) 검정 3종: ① 조기/후기 응답자 간 t-검정(5% 수준에서 유의차 없음), ② NASSCOM DB 기준 규모·연령 비교(유의차 없음), ③ 완전/불완전 응답 간 규모·연령 비교(유의차 없음) | p.17, §3.1 |
| STEP 7 | 측정도구 개발: 기존 연구에서 검증된 다문항 척도를 채택(Appendix 1 참조)하되, 산업전문가·학계·얼라이언스 매니저 대상 17회 인터뷰를 통해 문항 정제. Coordination/Communication/Bonding은 Schreiner et al.(2009)에서 직접 차용(+ 일부 추가항목), DJ/PJ는 Luo(2007), Resource Combination은 Wiklund & Shepherd(2009), Adaptation은 Gibson & Birkinshaw(2004)+Nadkarni & Herrmann(2010), Alliance Performance는 Krishnan et al.(2006)+Kale & Singh(2007) | p.17, §3.2 |
| STEP 8 | 성과 척도에 대한 사전검토(pre-test) 및 파일럿 테스트 실시하여 문항의 모호성 제거 | p.17, §3.2 |
| STEP 9 | 통제변수 설정: 파트너십 지속 기간(Cao & Lumineau, 2015 기준), 기업 규모(Choi & Contractor, 2019 등 기준) | p.17, §3.3 |
| STEP 10 | 공통방법편의(CMB) 점검 3중 절차: ① Harman의 단일요인검정(유의한 단일요인 미발견), ② 공통방법요인기법(적합도 매우 낮음: χ2/df=3.83, CFI=0.507 등 → CMB 없음을 뒷받침), ③ 마커변수법(marker variable; "신규 파트너 탐색 성향"을 마커로 사용, 할인상관행렬 최대 차이=0.039) | p.17, §3.4 |
| STEP 11 | Mplus를 이용해 각 구성개념별 확인적 요인분석(CFA) 실시. 낮은 신뢰도·비수용 R² 문항 제거. 복합신뢰도(CR)·평균분산추출(AVE)로 집중타당도 확인(Appendix 1). 전체 측정모형 적합도: χ2/df=1.54, CFI=0.91, TLI=0.90, RMSEA=0.059, SRMR=0.076 | p.17, §3.5 |
| STEP 12 | 판별타당도 확인: 구성개념 간 상관계수와 AVE 제곱근 비교(Table 1). 한 쌍의 상관이 최저 AVE 제곱근보다 근소하게(0.01) 높았으나 판별타당도 인정 | p.18, §3.5 |
| STEP 13 | 2차 요인모형 타당성 검증: 단일요인모형(χ2/df=3.79, CFI=0.576) 및 상관고정모형(χ2/df=2.403, CFI=0.788)과 비교하여 2차모형(χ2/df=1.665, CFI=0.901)의 우수성 확인 | p.18, §4 |
| STEP 14 | 구조모형 추정 (1): Schreiner et al.(2009) 3요소 모형 + 파트너십 기간 통제 → 적합도 양호(χ2/df=1.70, CFI=0.911), 성과와의 관계 0.456(p=.000) | p.18, §4 |
| STEP 15 | 구조모형 추정 (2): 확장 7요소 모형(Fig.1) + 통제변수 → 적합도 더 우수(χ2/df=1.51, CFI=0.907), 성과와의 관계 0.489(p=.000). 두 모형이 비내재적(non-nested)이라 공식적 통계비교는 불가하며 계수·적합도 비교로 H1 지지 판단 | p.18, §4 |

## STEP 6 — Limitation 분리

### A. 논문이 스스로 인정한 한계

1. **단일 산업 한정**: "One of the limitations of our study is that it is restricted to a single industry. Although, the IT-services industry is global in nature... undertaking research in different sectors would enhance the generalizability of our model." (p.19–20, §5.3) — IT서비스 산업(주로 기술적 성격의 얼라이언스)에 국한되어 일반화 가능성 제한.

2. **형성 이후(post-formation) 단계만 다룸**: "We focused on the post-formation stage though it would be interesting to see how the presence of AMC affects the formation of new alliances though a study of initial negotiations and construction of alliance contracts." (p.20, §5.3) — 형성(pre-formation)/협상 단계와의 연계는 다루지 않음.

3. **횡단면 데이터로 인한 인과관계 추론의 한계**: "Our ability to infer causal relationships is reduced due to the cross-sectional nature of our data... our focal relationship may be reciprocal. For example, higher levels of AMC come with a cost that can only be borne by successful alliances. Longitudinal research would help to answer this limitation though the high levels of cooperation required are difficult to attain..." (p.20, §5.3) — 저자 스스로 역인과 가능성(고성과 얼라이언스일수록 AMC 투자 여력이 큼)을 인정하며, 종단연구의 실행 어려움까지 언급.

4. **계약적 거버넌스(contractual governance)와의 관계 미탐구**: "Future research could consider how contracts... include the dimensions of our extended conceptualization of AMC... are justice issues... explicitly written into contracts as part of contractual governance mechanisms?" (p.20, §5.3) — 확장된 AMC 차원(특히 공정성)이 실제 계약서에 어떻게 반영되는지는 검토되지 않음.

5. **성공/실패 얼라이언스 비교 부재**: "Additional insight could be gained from consideration of both successful and unsuccessful alliances." (p.20, §5.3) — 현재 표본은 (설문 시점에) 존재하는 얼라이언스만 포함되어, 이미 실패·해체된 얼라이언스는 비교 대상에서 제외됨.

### B. 논문이 언급하지 않았지만 비판적으로 의심할 점

1. **표본 수치의 불일치(투명성 문제)**: 본문은 "817개 기업에 발송 → 187개 응답 → 43개 불완전 응답 제외 → 응답률 18.8%"라고 서술하지만, 187−43=144로 계산되어 초록/결과에서 언급된 "154개 기업" 표본과 5~10개 정도 차이가 난다(818×18.8%≈153.6으로 오히려 154에 근접). 이는 단순 오타일 수도 있으나, 표본 구성 과정의 투명성에 의문을 제기할 수 있는 지점이다.

2. **생존자 편의(survivorship bias)**: 얼라이언스 실패 문제를 다루는 논문임에도 불구하고, 표본은 설문 시점에 "여전히 존재하는" 얼라이언스만을 대상으로 했다(제휴가 종료된 117개 기업은 사전에 표본에서 제외됨). 이는 얼라이언스 관리 역량과 성과의 관계를 실제보다 낙관적으로 추정할 위험이 있다 — 저조한 AMC로 인해 이미 해체된 얼라이언스는 관측되지 않기 때문.

3. **역인과(reverse causality)의 미해결**: 저자들도 인정하듯 AMC→성과의 인과 방향은 가정에 불과하다. 그러나 더 나아가, 자원/여유(slack)가 많은 고성과 기업이 공정성 활동이나 자원관리 스킬에 투자할 여력이 더 크다는 대안 설명(자원가용성 교란요인)이 통계적으로 통제되지 않았다.

4. **단일 응답자·단일 기업 관점(비대칭적 자기보고)**: 성과 측정 문항 중 "Our partner firm seems to be satisfied with the financial/overall performance"와 같이 파트너사의 만족도까지 초점기업(focal firm) 응답자가 추정하여 응답한다. 이는 파트너사의 실제 인식이 아니라 초점기업의 주관적 추측에 불과하며, 특히 분배적/절차적 공정성 항목("우리 회사는 공정하게 보상을 배분한다") 역시 자사 행위에 대한 자기평가이므로 사회적 바람직성 편향(social desirability bias)에 취약하다.

5. **모형 비교의 통계적 엄밀성 부족**: 저자들 스스로 밝히듯 "As the two models are not nested it was not possible to calculate other direct measures of comparison" (p.18) — 즉 확장모형(0.489)과 Schreiner모형(0.456)의 차이가 통계적으로 유의한 차이인지 공식 검정(예: 카이제곱 차이검정, 정보기준 비교 등)으로 확인되지 않았다. 두 표준화계수의 차이(0.033)가 크지 않다는 점에서, "더 강한 설명력"이라는 핵심 주장의 통계적 강건성은 상대적으로 약하다.

6. **응답률의 낮음과 비응답 편의 검정의 한계**: 응답률 18.8%는 절대적으로 낮은 수준이며, 저자가 실시한 비응답 편의 검정(조기/후기 응답 비교, 규모·연령 비교)은 관측 가능한 변수에 대해서만 이루어졌다. 응답하지 않은 기업들이 AMC나 성과와 같은 핵심 구성개념 자체에서 체계적으로 다를 가능성(관측되지 않는 특성에서의 차이)은 배제되지 않는다.

7. **국가·문화 맥락 특수성**: 인도라는 신흥시장(emerging economy), 그것도 IT서비스업이라는 특정 산업의 조직문화·계약관행·공정성 인식이 반영된 결과일 수 있다. 예컨대 절차적 공정성 인식은 문화적 권력거리(power distance)나 관계주의(relationalism) 성향에 따라 다르게 형성될 수 있어, 서구 선진국 맥락의 얼라이언스에 그대로 일반화하기 어려울 수 있다(저자는 산업 특수성만 한계로 언급하고 국가·문화 특수성은 별도로 논하지 않음).

8. **표본 크기 대비 모형 복잡도**: 7개의 1차 요인 + 1개의 2차 요인 + 1개의 결과변수를 포함하는 SEM에 154개(혹은 144개) 표본은 상대적으로 작은 편이며, 특히 Coordination의 AVE(0.489)가 기준치(0.50)에 못 미쳐 해당 요인의 측정 타당도가 다소 취약함에도 불구하고 저자는 이를 "0.50에 근접"하다는 이유로 그대로 채택했다.
